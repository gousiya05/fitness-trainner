version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: fitness_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitness_trainer
    networks:
      - fitness_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fitness_ai
    ports:
      - "8000:8000"
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=8000
      - MODEL_DIR=/app/models
    volumes:
      - ./ai-service/models:/app/models
    networks:
      - fitness_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/fitness_trainer
      - JWT_SECRET=your_super_secret_jwt_key_change_this
      - JWT_EXPIRE=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service
    networks:
      - fitness_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitness_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - fitness_network

volumes:
  mongodb_data:

networks:
  fitness_network:
    driver: bridge
